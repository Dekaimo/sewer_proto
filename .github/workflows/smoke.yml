name: Smoke test

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          V="${GODOT_VERSION}-stable"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -q "Godot_v${V}_linux.x86_64.zip"
          mv "Godot_v${V}_linux.x86_64" godot
      - name: Run 60 s headless
        run: |
          ./godot --headless --import || true
          ./godot --headless -s res://tools/smoke_test.gd 2>&1 | tee smoke.log
          echo "---- errors ----"
          grep -E "SCRIPT ERROR|ERROR|Parse Error" smoke.log | sort | uniq -c | head -40 || true
