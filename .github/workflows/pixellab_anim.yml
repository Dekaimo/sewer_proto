name: PixelLab animate

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'JSON配列: [{"name","mode":"anim|edit","src","desc","frames","last","direction","subject","variants"}]'
        required: true

permissions:
  contents: write

concurrency:
  group: pixellab
  cancel-in-progress: false

jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow -q
      - name: Generate
        env:
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
          JOBS: ${{ inputs.jobs }}
        run: python3 tools/pixellab_anim.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add assets_raw/gen
          git diff --cached --quiet && exit 0
          git commit -m "PixelLab generation"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
